<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RM Streaming Hub</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f8;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px;
    }

    header h1 {
      max-width: 1000px;
      margin: auto;
      font-size: 21px;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 25px 16px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,.06);
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    button {
      padding: 13px 18px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .primary {
      background: #111;
      color: white;
    }

    .secondary {
      background: #e5e5e5;
      color: #111;
    }

    .hidden {
      display: none;
    }

    .fan-id {
      background: #f0f0f0;
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
    }

    .fan-id strong {
      display: block;
      font-size: 21px;
      margin-top: 5px;
    }

    .goals {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }

    .goal {
      background: #fafafa;
      padding: 18px;
      border-radius: 14px;
    }

    .progress-bar {
      height: 9px;
      background: #ddd;
      border-radius: 20px;
      overflow: hidden;
      margin: 12px 0;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: #222;
    }

    .message {
      margin-top: 12px;
      color: #666;
    }

    footer {
      text-align: center;
      padding: 35px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>RM STREAMING HUB</h1>
</header>

<main>

  <!-- LOGIN -->

  <section id="authSection" class="card">

    <h2>Join the Hub</h2>

    <p style="margin-top:8px;color:#666;">
      Create an account to track your weekly support activities.
    </p>

    <input
      type="email"
      id="email"
      placeholder="Email address"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button
      class="primary"
      onclick="signUp()"
    >
      Create Account
    </button>

    <button
      class="secondary"
      onclick="signIn()"
    >
      Sign In
    </button>

    <div id="authMessage" class="message"></div>

  </section>


  <!-- DASHBOARD -->

  <section id="dashboard" class="hidden">

    <div class="card">

      <h2>Welcome! 💜</h2>

      <p style="margin-top:8px;color:#666;">
        Your personal activity dashboard.
      </p>

      <div class="fan-id">
        Anonymous Fan ID
        <strong id="fanId">Loading...</strong>
      </div>

      <button
        class="secondary"
        onclick="signOut()"
      >
        Sign Out
      </button>

    </div>


    <div class="card">

      <h2>🎯 This Week's Goals</h2>

      <div class="goals">

        <div class="goal">
          <h3>🎧 Spotify</h3>

          <div class="progress-bar">
            <div
              class="progress"
              id="spotifyProgress"
            ></div>
          </div>

          <span id="spotifyCount">0</span>
        </div>


        <div class="goal">
          <h3>▶️ YouTube</h3>

          <div class="progress-bar">
            <div
              class="progress"
              id="youtubeProgress"
            ></div>
          </div>

          <span id="youtubeCount">0</span>
        </div>


        <div class="goal">
          <h3>🎵 YouTube Music</h3>

          <div class="progress-bar">
            <div
              class="progress"
              id="ytMusicProgress"
            ></div>
          </div>

          <span id="ytMusicCount">0</span>
        </div>


        <div class="goal">
          <h3>🗳️ Voting</h3>

          <div class="progress-bar">
            <div
              class="progress"
              id="voteProgress"
            ></div>
          </div>

          <span id="voteCount">0</span>
        </div>

      </div>

    </div>

  </section>

</main>


<footer>
  RM Streaming Hub
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

async function signUp() {

  const email =
    document.getElementById("email").value;

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("authMessage");

  if (!email || !password) {

    message.textContent =
      "Please enter your email and password.";

    return;
  }

  const { data, error } =
    await supabaseClient.auth.signUp({
      email: email,
      password: password
    });

  if (error) {

    message.textContent =
      error.message;

    return;
  }

  message.textContent =
    "Account created! Check your email if confirmation is required.";

}


async function signIn() {

  const email =
    document.getElementById("email").value;

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("authMessage");

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (error) {

    message.textContent =
      error.message;

    return;
  }

  await loadDashboard();

}


async function signOut() {

  await supabaseClient.auth.signOut();

  document
    .getElementById("dashboard")
    .classList.add("hidden");

  document
    .getElementById("authSection")
    .classList.remove("hidden");

}


async function loadDashboard() {

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) return;

  document
    .getElementById("authSection")
    .classList.add("hidden");

  document
    .getElementById("dashboard")
    .classList.remove("hidden");


  let { data: profile } =
    await supabaseClient
      .from("fan_profiles")
      .select("*")
      .eq("id", user.id)
      .maybeSingle();


  if (!profile) {

    const fanCode =
      generateFanCode();

    const { data: newProfile, error } =
      await supabaseClient
        .from("fan_profiles")
        .insert({
          id: user.id,
          fan_code: fanCode
        })
        .select()
        .single();

    if (!error) {
      profile = newProfile;
    }

  }


  if (profile) {

    document
      .getElementById("fanId")
      .textContent =
      profile.fan_code;

  }

}


function generateFanCode() {

  const characters =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let code = "RM-";

  for (let i = 0; i < 5; i++) {

    code += characters[
      Math.floor(
        Math.random() *
        characters.length
      )
    ];

  }

  return code;

}


async function checkSession() {

  const {
    data: { session }
  } =
    await supabaseClient.auth.getSession();

  if (session) {

    await loadDashboard();

  }

}


checkSession();

</script>

</body>
</html>
